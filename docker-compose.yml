services:
  api:
    depends_on:
      - postgres
    env_file: app/.env

  postgres:
    image: postgres:16
    env_file: app/.env
    volumes:
      # Postgres <=17 keeps data in /var/lib/postgresql/data (its PGDATA). Mounting the
      # parent dir instead leaves data in an anonymous volume that's lost on recreate.
      # (Postgres 18+ moved PGDATA, and expects /var/lib/postgresql.)
      - postgres-db:/var/lib/postgresql/data

volumes:
  postgres-db:
