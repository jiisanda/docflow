# console.docflow.localhost: RustFS web console (dev only).
upstream rustfs_console {
    zone rustfs_console 64k;
    server rustfs:9001 resolve;
}

# Only plain browser visits (no auth header, no query string) get redirected.
map "$http_authorization$args" $rustfs_console_redirect {
    ""      1;
    default 0;
}

server {
    listen 80;
    listen [::]:80;
    server_name console.docflow.localhost;

    access_log /var/log/nginx/access.log docflow;
    include /etc/nginx/snippets/security-headers.conf;

    client_max_body_size 0;   # console allows uploading objects

    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;

    # The console UI lives under /rustfs/console/, and a bare / returns 403, so send
    # browsers there. But the console also calls / itself as a signed S3 request
    # (ListBuckets): that must reach RustFS untouched, because browsers drop headers
    # like Content-Type when following a redirect, which breaks the signature.
    location = / {
        if ($rustfs_console_redirect) {
            return 302 /rustfs/console/;
        }
        proxy_pass http://rustfs_console;
    }

    location / {
        proxy_pass http://rustfs_console;
    }
}
