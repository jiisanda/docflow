# store.docflow.localhost: RustFS S3 API. Presigned upload/download URLs point here.
upstream rustfs_s3 {
    zone rustfs_s3 64k;
    server rustfs:9000 resolve;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name store.docflow.localhost;

    access_log /var/log/nginx/access.log docflow;

    ignore_invalid_headers off;   # S3 clients send headers nginx would otherwise drop
    client_max_body_size 0;       # part size is limited by S3, not nginx
    proxy_buffering off;          # stream bodies both ways, no temp files
    proxy_request_buffering off;

    location / {
        proxy_http_version 1.1;
        # The S3 signature covers the Host header: pass it through unchanged (with port).
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;

        proxy_connect_timeout 5s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_pass http://rustfs_s3;
    }
}
