# Dev: proxy to the Vite dev server, with WebSocket upgrade for HMR.
location / {
    include /etc/nginx/snippets/proxy-headers.conf;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;   # keep the HMR socket open
    proxy_pass http://docflow_ui;
}
