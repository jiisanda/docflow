# Shared http-level settings, loaded by the stock nginx.conf (include conf.d/*.conf).
# Per-environment pieces are mounted at /etc/nginx/docflow/:
#   dev/  -> Vite dev server + RustFS vhosts (store., console.)
#   prod/ -> built UI served as static files

server_tokens off;

# Docker's embedded DNS. Together with `resolve` on upstream servers, nginx keeps
# working when a container restarts with a new IP (instead of 502 until reload).
resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket upgrade support (Vite HMR, RustFS console).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

log_format docflow '$remote_addr $host [$time_local] "$request" $status '
                   '$body_bytes_sent rt=$request_time urt=$upstream_response_time '
                   '"$http_referer" "$http_user_agent"';

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/javascript application/javascript
           application/json application/xml image/svg+xml;

# Brute-force protection for login/signup.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_status 429;

upstream docflow_api {
    zone docflow_api 64k;
    server api:8000 resolve;
    keepalive 16;
}

include /etc/nginx/docflow/servers/*.conf;
