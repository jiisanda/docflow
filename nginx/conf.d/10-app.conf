# docflow.localhost: UI at /, FastAPI at /v2/ (same origin, so the API needs no CORS).
# default_server also catches any other Host (e.g. the server's IP or public DNS in prod).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name docflow.localhost;

    access_log /var/log/nginx/access.log docflow;
    include /etc/nginx/snippets/security-headers.conf;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /v2/ {
        # Requests above this size will use presigned multipart uploads straight to S3.
        client_max_body_size 110m;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location ~ ^/v2/u/(login|signup)$ {
        limit_req zone=auth burst=5 nodelay;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # FastAPI docs and health.
    location ~ ^/(docs|redoc|openapi\.json|health)(/|$) {
        include /etc/nginx/snippets/api-proxy.conf;
    }

    include /etc/nginx/docflow/ui.conf;
}
